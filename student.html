<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tesla Financials - Student</title>
  <style>
    table { border-collapse: collapse; margin: 10px; }
    td, th { border: 1px solid #ccc; padding: 8px; text-align: right; cursor: pointer; }
    .highlight { background-color: yellow; }
    .correct { background-color: lightgreen; }
    #timer { font-size: 24px; color: red; margin: 10px 0; }
    #success-list { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Student View</h1>
  <div>
    <label>Name: <input type="text" id="student-name" placeholder="Enter your name"></label>
    <button onclick="joinGame()">Join Game</button>
  </div>
  <div id="timer">Waiting for teacher to start...</div>
  <div id="success-count">Students found: 0</div>
  <div id="success-list"></div>
  
  <h2>Balance Sheet</h2>
  <table id="balance-sheet"></table>
  <h2>Income Statement</h2>
  <table id="income-statement"></table>

  <script>
    const APP_ID = 'zKIGVAT4i80luijNDM40xZCl-gzGzoHsz';
    const APP_KEY = 'u6eipqxC1UGkkxR1nJcMR8sH';
    const BASE_URL = `https://zKIGVAT4i80luijNDM40xZCl-gzGzoHsz.lc-cn-n1-shared.com/1.1`;

    // Same data as teacher.html (omitted for brevity - paste from teacher.html)
    const balanceSheetData = [ /* ... same as above ... */ ];
    const incomeStatementData = [ /* ... same as above ... */ ];

    let studentName = '';
    let currentTarget = null;
    let startTime = null;
    let timerInterval = null;

    // Render tables (same as teacher)
    function renderTable(containerId, data, prefix) {
      // ... identical to teacher.html ...
    }

    // Join game
    function joinGame() {
      const name = document.getElementById('student-name').value.trim();
      if (!name) return alert('Enter your name!');
      studentName = name;
      document.querySelector('input').disabled = true;
      document.querySelector('button').disabled = true;
      pollForRound();
    }

    // Poll LeanCloud for new rounds
    async function pollForRound() {
      try {
        const res = await fetch(`${BASE_URL}/classes/GameRound?limit=1&order=-createdAt`, {
          headers: { 'X-LC-Id': APP_ID, 'X-LC-Key': APP_KEY }
        });
        const data = await res.json();
        
        if (data.results && data.results.length > 0) {
          const round = data.results[0];
          if (round.targetCellId !== currentTarget) {
            // New round!
            currentTarget = round.targetCellId;
            startTime = new Date(round.startTime.iso);
            resetTimer();
            startTimer();
            updateSuccessList(round.completedBy || []);
            
            // Highlight target cell
            document.querySelectorAll('td').forEach(cell => {
              cell.classList.remove('correct');
              if (cell.id === currentTarget) {
                cell.classList.add('highlight');
              }
            });
          }
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
      setTimeout(pollForRound, 3000); // Poll every 3s
    }

    // Timer logic
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((new Date() - startTime) / 1000);
        document.getElementById('timer').innerText = `Time: ${elapsed}s`;
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer').innerText = 'Round started! Find the cell...';
    }

    // Handle cell tap
    document.addEventListener('click', async (e) => {
      if (!currentTarget || !studentName || !e.target.matches('td')) return;
      
      if (e.target.id === currentTarget) {
        // Correct!
        e.target.classList.remove('highlight');
        e.target.classList.add('correct');
        
        // Record success
        try {
          const res = await fetch(`${BASE_URL}/classes/GameRound?where={"targetCellId":"${currentTarget}"}`, {
            headers: { 'X-LC-Id': APP_ID, 'X-LC-Key': APP_KEY }
          });
          const data = await res.json();
          if (data.results.length > 0) {
            const objectId = data.results[0].objectId;
            const completedBy = [...(data.results[0].completedBy || []), studentName];
            
            await fetch(`${BASE_URL}/classes/GameRound/${objectId}`, {
              method: 'PUT',
              headers: { 
                'X-LC-Id': APP_ID, 
                'X-LC-Key': APP_KEY,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ completedBy })
            });
          }
        } catch (err) {
          console.error('Failed to record success:', err);
        }
      }
    });

    // Update success display
    function updateSuccessList(names) {
      document.getElementById('success-count').innerText = `Students found: ${names.length}`;
      document.getElementById('success-list').innerHTML = 
        names.length ? `<strong>Found by:</strong> ${names.join(', ')}` : '';
    }

    // Init tables
    renderTable('balance-sheet', balanceSheetData, 'bs');
    renderTable('income-statement', incomeStatementData, 'is');
  </script>
</body>
</html>
