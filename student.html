<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Find the Number!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 60px 16px 16px;
      font-family: Arial, sans-serif;
      background: #fafafa;
    }
    #floating-status {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      z-index: 1000;
      font-weight: bold;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-bottom: 24px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      text-align: right;
      border: 1px solid #ddd;
    }
    th { text-align: left; background: #f5f5f5; }
    td[data-cell-id] {
      cursor: pointer;
      transition: background 0.2s;
    }
    td[data-cell-id]:hover {
      background: #f0f8ff;
    }
    .wrong-cell { background: #ffebee !important; }
    .correct-cell { background: #e8f5e8 !important; }
  </style>
</head>
<body>
  <div id="floating-status">🎮 Waiting for teacher to start...</div>

  <h1>🔍 Find the Hidden Number!</h1>

  <h2>Balance Sheet</h2>
  <table id="balance-sheet"></table>

  <h2>Income Statement</h2>
  <table id="income-statement"></table>

  <script>
    const APP_ID = "zKIGVAT4i80luijNDM40xZCl-gzGzoHsz";
    const APP_KEY = "u6eipqxC1UGkkxR1nJcMR8sH";
    const BASE_URL = "https://api.leancloud.cn/1.1";

    // Same data and helper functions as teacher
    const balanceSheetData = [/* same as above */];
    const incomeStatementData = [/* same as above */];

    function generateCellId(prefix, rowLabel, yearIndex) {
      const years = ["2024", "2023", "2022"];
      return `${prefix}-${rowLabel.toLowerCase().replace(/[^a-z0-9]/g, '-')}-${years[yearIndex]}`;
    }

    function renderTable(containerId, data, prefix) {
      const container = document.getElementById(containerId);
      let headers = '<tr><th>Item</th><th>2024</th><th>2023</th>';
      if (data[0].length > 3) headers += '<th>2022</th>';
      headers += '</tr>';

      let rows = '';
      data.forEach(row => {
        const label = row[0];
        rows += `<tr><td>${label}</td>`;
        for (let j = 1; j < row.length; j++) {
          const value = row[j];
          const display = typeof value === 'number' ? value.toLocaleString() : value;
          const cellId = generateCellId(prefix, label, j - 1);
          rows += `<td data-cell-id="${cellId}" data-value="${value}">${display}</td>`;
        }
        rows += '</tr>';
      });
      container.innerHTML = headers + rows;
    }

    renderTable('balance-sheet', balanceSheetData, 'bs');
    renderTable('income-statement', incomeStatementData, 'is');

    let currentTarget = null;
    let hasWon = false;
    let lastObjectId = null;

    function showMessage(text, isError = false) {
      const bar = document.getElementById('floating-status');
      bar.textContent = text;
      bar.style.color = isError ? 'red' : (text.includes('Congratulations') ? 'green' : '#333');
    }

    async function fetchLatestGameRound() {
      try {
        const response = await fetch(`${BASE_URL}/classes/GameRound?limit=1&order=-createdAt`, {
          headers: {
            "X-LC-Id": APP_ID,
            "X-LC-Key": APP_KEY
          }
        });
        const data = await response.json();
        if (data.results && data.results.length > 0) {
          const round = data.results[0];
          if (round.objectId !== lastObjectId) {
            // New round!
            currentTarget = round.targetCellId;
            hasWon = false;
            lastObjectId = round.objectId;

            // Clear highlights
            document.querySelectorAll('.wrong-cell, .correct-cell').forEach(el => {
              el.classList.remove('wrong-cell', 'correct-cell');
            });

            showMessage("A new round has begun!");
          }
        } else {
          showMessage("🎮 Waiting for teacher to start...");
        }
      } catch (error) {
        console.error("Fetch error:", error);
        showMessage("⚠️ Connection issue");
      }
    }

    // Poll every 2 seconds
    setInterval(fetchLatestGameRound, 2000);

    async function markAsCompleted(studentName = "Anonymous") {
      if (!lastObjectId) return;
      try {
        const response = await fetch(`${BASE_URL}/classes/GameRound/${lastObjectId}`, {
          method: 'PUT',
          headers: {
            "X-LC-Id": APP_ID,
            "X-LC-Key": APP_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            completedBy: { "__op": "AddUnique", "objects": [studentName] }
          })
        });
        if (!response.ok) {
          console.warn("Failed to update completedBy");
        }
      } catch (error) {
        console.error("Update error:", error);
      }
    }

    document.addEventListener('click', async (e) => {
      if (!e.target.matches('td[data-cell-id]') || !currentTarget || hasWon) return;

      const clickedId = e.target.dataset.cellId;

      if (clickedId === currentTarget) {
        e.target.classList.add('correct-cell');
        showMessage("Correct! Congratulations!", false);
        hasWon = true;
        await markAsCompleted(); // Add to completedBy
      } else {
        e.target.classList.add('wrong-cell');
        showMessage("You got it wrong!", true);
      }
    });

    // Initial load
    fetchLatestGameRound();
  </script>
</body>
</html>
