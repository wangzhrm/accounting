    let selectedCell = null;

    // Render tables
    function renderTable(containerId, data, prefix) {
      const container = document.getElementById(containerId);
      let html = '<tr><th>Item</th><th>2024</th><th>2023</th>' + (data[0].length > 3 ? '<th>2022</th>' : '') + '</tr>';
      data.forEach((row, i) => {
        html += `<tr>`;
        html += `<td>${row[0]}</td>`;
        for (let j = 1; j < row.length; j++) {
          const year = 2025 - j;
          const cellId = `${prefix}-${i}-${j}`;
          html += `<td id="${cellId}" data-value="${row[j]}">${row[j].toLocaleString()}</td>`;
        }
        html += `</tr>`;
      });
      container.innerHTML = html;

      // Add click handlers
      container.querySelectorAll('td').forEach(cell => {
        cell.addEventListener('click', () => {
          if (selectedCell) selectedCell.classList.remove('selected');
          cell.classList.add('selected');
          selectedCell = cell;
          startNewRound(cell.id);
        });
      });
    }

    // Start new round in LeanCloud
    async function startNewRound(cellId) {
      const now = new Date().toISOString();
      const payload = {
        targetCellId: cellId,
        startTime: { __type: 'Date', iso: now },
        completedBy: []
      };

      try {
        // Delete old rounds
        await fetch(`${BASE_URL}/classes/GameRound`, {
          method: 'DELETE',
          headers: { 'X-LC-Id': APP_ID, 'X-LC-Key': APP_KEY }
        });

        // Create new round
        await fetch(`${BASE_URL}/classes/GameRound`, {
          method: 'POST',
          headers: { 
            'X-LC-Id': APP_ID, 
            'X-LC-Key': APP_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        document.getElementById('status').innerText = `Round started! Target: ${cellId}`;
      } catch (err) {
        console.error('Failed to start round:', err);
        alert('Error starting round. Check console.');
      }
    }

    // Init
    renderTable('balance-sheet', balanceSheetData, 'bs');
    renderTable('income-statement', incomeStatementData, 'is');
  </script>
