<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Trading Simulation - Final Fixed Version</title>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script> 
  <style>
    /* ------------------------------------------------------------------- */
    /* --- CSS Styles (Unchanged) ---------------------------------------- */
    /* ------------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e0e7ff 100%);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      color: #333;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 12px 20px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      color: #2c3e50;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h1, h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    /* Login */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background-color: #4a6fa5;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #3a5a80;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-danger {
      background-color: #e74c3c;
    }
    .btn-danger:hover {
      background-color: #c0392b;
    }
    .btn-warning {
        background-color: #f39c12;
    }
    .btn-warning:hover {
        background-color: #e67e22;
    }

    #status {
      text-align: center;
      margin: 12px 0;
      min-height: 22px;
      font-weight: bold;
    }
    .error {
      color: #e74c3c;
    }

    /* Market Prices – Compact Grid */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .stock-item {
      background: #f9fafc;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border-left: 3px solid #4a6fa5;
      font-size: 0.9em;
    }
    .stock-name {
      color: #555;
      font-size: 0.85em;
      margin-bottom: 2px;
    }
    .stock-ticker {
      font-weight: bold;
      font-size: 0.95em;
    }
    .stock-price {
      font-weight: bold;
      color: #2c3e50;
      margin-top: 4px;
      font-size: 1.05em;
    }
    /* Status for price update time */
    #priceStatus {
        font-size: 0.8em;
        color: #777;
        margin-top: 5px;
        text-align: center;
        justify-content: center; 
        margin-bottom: 10px;
    }


    /* Portfolio Summary */
    .portfolio-header {
      margin-bottom: 15px;
      text-align: center;
      /* Flex container for the chart and table */
      display: flex;
      flex-direction: column; 
      align-items: center;
    }
    .portfolio-value-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
    }
    .value-label {
        font-size: 1.1em;
        color: #555;
        font-weight: 500;
        margin-bottom: 5px;
    }
    .total-value-display {
      font-size: 1.8em; /* Made slightly larger */
      font-weight: bold;
      color: #27ae60;
      margin: 0 0 10px 0;
    }
    .cash-display {
      font-size: 1.2em;
      color: #2980b9;
      margin-bottom: 20px;
    }
    
    /* Chart Container */
    #chartContainer {
        width: 100%;
        max-width: 400px; /* Constrain chart size */
        margin: 20px auto 30px auto;
    }

    /* Portfolio Table */
    .portfolio-table-wrapper {
      overflow-x: auto;
      width: 100%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }
    th,
    td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid #eee;
      font-size: 0.95em;
    }
    th {
      background-color: #f1f3f5;
      font-weight: 600;
      color: #2c3e50;
    }
    tr:hover {
      background-color: #f9fafb;
    }

    /* Compact Trade Controls */
    .trade-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .qty-input {
      width: 45px;
      text-align: center;
      padding: 4px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Leaderboard */
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .rank {
      font-weight: bold;
      width: 30px;
    }
    .leader-name {
      flex: 1;
      text-align: left;
      padding-left: 10px;
    }
    .leader-value {
      font-weight: bold;
      color: #27ae60;
    }

    /* Source info at bottom */
    #dataSourceInfo {
      font-size: 0.7em;
      color: #aaa;
      text-align: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
      .market-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .stock-item {
        padding: 8px;
      }
      .stock-name {
        font-size: 0.75em;
      }
      .stock-ticker {
        font-size: 0.85em;
      }
      .stock-price {
        font-size: 1em;
      }
      .total-value-display {
        font-size: 1.4em;
      }
      .cash-display {
        font-size: 1em;
      }
      h2 {
        font-size: 1.3em;
      }
      button {
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="user-info" id="userInfo" style="display:none;">
      <span id="displayName">User</span>
      <button onclick="logout()" class="btn-danger">Logout</button>
    </div>
  </div>

  <div class="container">
    <div id="loginView" class="card">
      <h1>Trading Simulation Login</h1>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
      </div>
      <button onclick="login()">Login</button>
      <div id="status"></div>
    </div>

    <div id="dashboardView" style="display: none;">
      <div class="card">
        <h2>Market Prices (Real-time)</h2>
        <div id="priceStatus">
            <span>Checking historical database...</span>
        </div>
        <div class="market-grid" id="marketGrid"></div>
        <div id="dataSourceInfo"></div>
      </div>

      <div class="card">
        <div class="portfolio-header">
          <h2>Your Portfolio</h2>
          
          <div class="portfolio-value-container">
            <span class="value-label">Total Portfolio Value:</span>
            <div class="total-value-display" id="totalPortfolioValue">$0.00</div>
            
            <span class="value-label">Cash Position:</span>
            <div class="cash-display" id="cashBalance">Cash: $0.00</div>
          </div>
          
          <div id="chartContainer">
            <canvas id="portfolioChart"></canvas>
          </div>
          </div>

        <div class="portfolio-table-wrapper">
          <table id="portfolioTable">
            <thead>
              <tr>
                <th>Company</th>
                <th>Ticker</th>
                <th>Shares Held</th>
                <th>Current Price</th>
                <th>Stock Value</th>
                <th>Trade</th>
              </tr>
            </thead>
            <tbody id="portfolioBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Leaderboard</h2>
        <div id="leaderboardList"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REMINDER: REPLACE THIS WITH YOUR ACTUAL FINNHUB API KEY (REQUIRED!)
    const FINNHUB_API_KEY = "d4jsqvpr01qgcb0vc20gd4jsqvpr01qgcb0vc210"; 

    // ✅ UPDATED CACHING TIME TO 10 MINUTES
    const CACHE_EXPIRATION_MINUTES = 10; // Changed from 720 to 10 minutes
    const REFRESH_INTERVAL_MS = 600000; // Check every 10 minutes (600,000 ms)

    const COMPANIES = [
      { name: "Apple Inc.", symbol: "AAPL" },
      { name: "Johnson & Johnson", symbol: "JNJ" },
      { name: "Exxon Mobil Corporation", symbol: "XOM" }, 
      { name: "JPMorgan Chase & Co.", symbol: "JPM" },
      { name: "Walmart Inc.", symbol: "WMT" },
      { name: "The Boeing Company", symbol: "BA" },
      { name: "The Walt Disney Company", symbol: "DIS" },
      { name: "Caterpillar Inc.", symbol: "CAT" },
      { name: "Procter & Gamble Co.", symbol: "PG" },
      { name: "American Tower Corporation", symbol: "AMT" }
    ];

    let marketPrices = {}; 
    let currentUser = null;
    let priceUpdateInterval;
    let isFetching = false; 
    let portfolioChart = null; // Global Chart instance

    // LeanCloud Initialization (Credentials from your trading app)
    AV.init({
      appId: "W9n8YEzowrs5Lzz3BqjttHiM-gzGzoHsz",
      appKey: "5mrY6acHapGt8ngzVn0ZGBnw",
      serverURL: "https://w9n8yezo.lc-cn-n1-shared.com"
    });

    // -------------------------------------------------------------------
    // --- UTILITY FUNCTION: Consolidate Historical Data -----------------
    // -------------------------------------------------------------------
    
    /**
     * Consolidates a list of historical StockPrice objects into a single {symbol: price} object.
     * Checks if the data is fresh (all records created within the last 10 minutes) and complete.
     */
    function consolidateHistoricalPrices(pricesArray) {
        if (pricesArray.length === 0) return null;
        
        const consolidated = {};
        const now = new Date().getTime();
        const expirationTimeMs = CACHE_EXPIRATION_MINUTES * 60000;
        let isFresh = true;
        
        pricesArray.forEach(record => {
            const symbol = record.get('symbol');
            const price = record.get('closePrice'); 
            
            const recordTime = record.createdAt.getTime(); 
            
            if (now - recordTime > expirationTimeMs) {
                isFresh = false; 
            }
            
            if (price !== undefined && price > 0 && symbol) {
                 consolidated[symbol] = Number(price); 
            }
        });
        
        // Check if we have all 10 companies AND the data is fresh
        if (isFresh && Object.keys(consolidated).length === COMPANIES.length) {
            return consolidated;
        }
        
        return null;
    }


    // -------------------------------------------------------------------
    // --- PRICE FETCHING LOGIC ------------------------------------------
    // -------------------------------------------------------------------

    /**
     * Checks the StockPrice class for recent data. If stale/missing, fetches from Finnhub.
     */
    async function fetchAndCachePrices() {
        if (isFetching) return;
        isFetching = true;

        const statusEl = document.getElementById('priceStatus').querySelector('span');
        const dataSourceEl = document.getElementById('dataSourceInfo');
        statusEl.textContent = "Checking historical database (StockPrice)...";
        dataSourceEl.textContent = ""; // Clear previous source info
        
        let cachedPrices = null;

        try {
            // 1. Fetch latest historical data
            const historicalQuery = new AV.Query('StockPrice');
            historicalQuery.descending('createdAt');
            historicalQuery.limit(COMPANIES.length * 2); 
            historicalQuery.select(['symbol', 'closePrice', 'createdAt']);
            
            const historicalRecords = await historicalQuery.find();
            
            // Filter to get the absolute latest unique record for each symbol
            const latestRecordsMap = new Map();
            historicalRecords.forEach(record => {
                const symbol = record.get('symbol');
                if (!latestRecordsMap.has(symbol)) {
                    latestRecordsMap.set(symbol, record);
                }
            });
            
            const latestRecords = Array.from(latestRecordsMap.values());

            // 2. Consolidate and check if the latest records are fresh (less than 10 minutes old)
            cachedPrices = consolidateHistoricalPrices(latestRecords);

            // 3. CACHE HIT: Found fresh, complete data in StockPrice
            if (cachedPrices) {
                marketPrices = cachedPrices;
                const lastUpdateTime = latestRecords[0] ? latestRecords[0].createdAt.toLocaleTimeString() : 'N/A';
                statusEl.textContent = `Prices loaded from database (as of ${lastUpdateTime}).`;
                dataSourceEl.textContent = "Stock prices obtained from database";
            }

        } catch (readError) {
             if (readError.message.includes("404")) {
                 console.warn("StockPrice class not found. Proceeding to Finnhub fetch.");
             } else {
                 console.error("Historical data read failed:", readError);
             }
        }
        
        // 4. CACHE MISS: Data was stale, incomplete, or read failed - Fetch from Finnhub
        if (!cachedPrices) {
             statusEl.textContent = "Data stale or missing (over 10 minutes old). Fetching new data from Finnhub...";
             try {
                await fetchPricesFromFinnhub(); 
                dataSourceEl.textContent = "Stock prices fetched from Finnhub";
             } catch (fetchError) {
                statusEl.textContent = `Error fetching prices: ${fetchError.message}. Prices unavailable.`;
                dataSourceEl.textContent = "Failed to fetch prices";
             }
        }
        
        isFetching = false;
        return marketPrices;
    }

    /**
     * Executes the direct fetch from Finnhub and updates the StockPrice class.
     */
    async function fetchPricesFromFinnhub() {
        if (FINNHUB_API_KEY === "YOUR_FINNHUB_API_KEY") {
             throw new Error("Finnhub API Key is missing. Cannot fetch live prices.");
        }
        
        const StockPrice = AV.Object.extend('StockPrice'); 
        const updatedPrices = {}; 

        const statusEl = document.getElementById('priceStatus').querySelector('span');
        
        // Use Promise.all to fetch all 10 stocks concurrently
        const fetchPromises = COMPANIES.map(co => {
            const url = `https://finnhub.io/api/v1/quote?symbol=${co.symbol}&token=${FINNHUB_API_KEY}`;
            return fetch(url).then(r => r.json()).catch(err => {
                console.error(`Finnhub fetch failed for ${co.symbol}:`, err);
                return null;
            });
        });

        const results = await Promise.all(fetchPromises);
        let successfulFetches = 0;
        const objectsToSave = [];

        results.forEach((data, index) => {
            const symbol = COMPANIES[index].symbol;
            
            if (data && data.c !== undefined && data.c > 0) { // Use 'c' for current price instead of 'pc'
                const price = data.c;
                
                // 1. Prepare for saving to the HISTORICAL StockPrice class
                const historicalObj = new StockPrice();
                historicalObj.set('symbol', symbol);
                historicalObj.set('closePrice', Number(price)); 
                objectsToSave.push(historicalObj);

                // 2. Update the consolidated price set
                updatedPrices[symbol] = Number(price);
                successfulFetches++;
            } else {
                updatedPrices[symbol] = 0; 
                console.warn(`Could not get valid data for ${symbol}. Using 0.`);
            }
        });

        if (successfulFetches === 0) {
            throw new Error("Failed to fetch price data for any stock from Finnhub.");
        }

        // 3. Save ALL new individual records to the StockPrice class (Historical Update)
        await AV.Object.saveAll(objectsToSave);
        
        // 4. Update the global prices
        marketPrices = updatedPrices;

        statusEl.textContent = `Prices updated from Finnhub (Success: ${successfulFetches}/10) and saved to database.`;
    }

    // -------------------------------------------------------------------
    // --- MAIN APP LOGIC ------------------------------------------------
    // -------------------------------------------------------------------

    function startPriceUpdates() {
        updateDashboardData();
        
        clearInterval(priceUpdateInterval);
        priceUpdateInterval = setInterval(updateDashboardData, REFRESH_INTERVAL_MS); 
    }

    async function updateDashboardData() {
        await fetchAndCachePrices();
        if (currentUser) {
            renderMarket();
            renderPortfolio();
            fetchLeaderboard();
        }
    }

    async function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (!u || !p) return showError("Please enter username and password.");

      try {
        const query = new AV.Query('Student');
        query.equalTo('username', u);
        const results = await query.find();
        if (results.length === 0) throw new Error("User not found");

        const user = results[0];
        if (user.get('password') !== p) throw new Error("Invalid password");

        // Initialize new fields if necessary on first login
        if (user.get('balance') === undefined) {
          user.set('balance', 10000);
          user.set('holdings', {});
          user.set('transactionCount', 0);
          user.set('totalTransactedAmount', 0);
          user.set('earlyMorningTrades', 0);
          user.set('lateNightTrades', 0);
          await user.save();
        }

        currentUser = user;
        document.getElementById('displayName').textContent = u;
        document.getElementById('userInfo').style.display = 'flex';
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';

        startPriceUpdates(); 

      } catch (err) {
        showError(err.message || "Login failed");
      }
    }

    function showError(msg) {
      document.getElementById('status').textContent = msg;
      document.getElementById('status').className = 'error';
    }

    function renderMarket() {
      const container = document.getElementById('marketGrid');
      container.innerHTML = '';
      COMPANIES.forEach(co => {
        const price = marketPrices[co.symbol] || 0; 
        const div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML = `
          <div class="stock-name">${co.name}</div>
          <div class="stock-ticker">${co.symbol}</div>
          <div class="stock-price">$${price.toFixed(2)}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderPortfolio() {
      const balance = currentUser.get('balance') || 10000;
      const holdings = currentUser.get('holdings') || {};
      const body = document.getElementById('portfolioBody');
      let totalValue = balance;
      
      const chartLabels = ["Cash"];
      const chartData = [balance];
      const chartColors = ["#2980b9"]; // Blue for Cash
      
      // Define a palette for stocks (10 colors)
      const stockPalette = [
        '#2ecc71', '#f1c40f', '#e67e22', '#3498db', '#9b59b6',
        '#1abc9c', '#e74c3c', '#c0392b', '#7f8c8d', '#2c3e50'
      ];
      let colorIndex = 0;

      body.innerHTML = '';
      document.getElementById('cashBalance').textContent = `$${balance.toFixed(2)}`;

      COMPANIES.forEach(co => {
        const qty = holdings[co.symbol] || 0;
        const price = marketPrices[co.symbol] || 0;
        const stockValue = qty * price;
        totalValue += stockValue;

        if (stockValue > 0) {
            chartLabels.push(co.symbol);
            chartData.push(stockValue);
            chartColors.push(stockPalette[colorIndex % stockPalette.length]);
            colorIndex++;
        }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${co.name}</td>
          <td>${co.symbol}</td>
          <td>${qty}</td>
          <td>$${price.toFixed(2)}</td>
          <td class="total-value">$${stockValue.toFixed(2)}</td>
          <td>
            <div class="trade-controls">
              <input type="number" min="1" value="1" class="qty-input" id="qty-${co.symbol}">
              <button onclick="trade('${co.symbol}', 'buy')">Buy</button>
              <button class="btn-danger" onclick="trade('${co.symbol}', 'sell')">Sell</button>
            </div>
          </td>
        `;
        body.appendChild(row);
      });

      document.getElementById('totalPortfolioValue').textContent = `$${totalValue.toFixed(2)}`;
      
      // ----------------------------------------------------
      // --- Render Pie Chart ---
      // ----------------------------------------------------
      if (portfolioChart) {
        portfolioChart.destroy(); // Destroy existing chart before creating a new one
      }

      const ctx = document.getElementById('portfolioChart').getContext('2d');
      portfolioChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: chartLabels,
          datasets: [{
            data: chartData,
            backgroundColor: chartColors,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
              labels: {
                font: {
                    size: 14
                }
              }
            },
            title: {
              display: true,
              text: 'Portfolio Asset Distribution',
              font: {
                  size: 16
              }
            },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        let label = context.label || '';
                        if (label) {
                            label += ': ';
                        }
                        if (context.parsed !== null) {
                            const value = context.parsed;
                            const percentage = (value / totalValue * 100).toFixed(1);
                            label += `$${value.toFixed(2)} (${percentage}%)`;
                        }
                        return label;
                    }
                }
            }
          }
        }
      });
    }

    // ✅ FIXED trade() function with all missing set() calls
    async function trade(symbol, action) {
      const input = document.getElementById(`qty-${symbol}`);
      const qty = parseInt(input.value);
      if (!qty || qty <= 0) return alert("Enter a valid number of shares.");

      const price = marketPrices[symbol];
      if (!price || price === 0) return alert("Cannot trade. Price data is currently unavailable.");

      const total = price * qty;
      let balance = currentUser.get('balance');
      let holdings = { ...currentUser.get('holdings') };

      // Initialize/Retrieve new tracking fields
      let totalTransactedAmount = currentUser.get('totalTransactedAmount') || 0;
      let earlyMorningTrades = currentUser.get('earlyMorningTrades') || 0;
      let lateNightTrades = currentUser.get('lateNightTrades') || 0;
      let transactionCount = currentUser.get('transactionCount') || 0;

      try {
        if (action === 'buy') {
          if (balance < total) throw new Error("Insufficient cash");
          balance -= total;
          holdings[symbol] = (holdings[symbol] || 0) + qty;
        } else {
          const current = holdings[symbol] || 0;
          if (current < qty) throw new Error("Not enough shares to sell");
          balance += total;
          holdings[symbol] = current - qty;
          if (holdings[symbol] <= 0) delete holdings[symbol];
        }

        // 1. Add absolute transaction value to total transacted amount
        totalTransactedAmount += total;

        // 2 & 3. Determine local hour and classify trade time window
        const now = new Date(); // Local browser time
        const hour = now.getHours();

        if (hour >= 5 && hour < 9) {
          earlyMorningTrades += 1;
        } else if (hour >= 21 || hour < 5) {
          lateNightTrades += 1;
        }

        // Increment total transaction count
        transactionCount += 1;

        // Save all fields to LeanCloud Student object
        currentUser.set('balance', balance);
        currentUser.set('holdings', holdings);
        currentUser.set('transactionCount', transactionCount);
        
        // 🔥 FIX APPLIED HERE: Must call set() for the new fields to persist them
        currentUser.set('totalTransactedAmount', totalTransactedAmount);
        currentUser.set('earlyMorningTrades', earlyMorningTrades);
        currentUser.set('lateNightTrades', lateNightTrades);
        
        await currentUser.save();

        renderPortfolio();
        fetchLeaderboard();
      } catch (err) {
        alert(err.message);
      }
    }

    async function fetchLeaderboard() {
      try {
        const query = new AV.Query('Student');
        const students = await query.find();

        const leaderboard = students
          .filter(student => student.get('username') !== '测试学生')
          .map(student => {
            const bal = student.get('balance') || 10000;
            const hold = student.get('holdings') || {};
            let total = bal;
            for (const [sym, q] of Object.entries(hold)) {
              total += (marketPrices[sym] || 0) * q;
            }
            return { username: student.get('username'), totalValue: total };
          })
          .sort((a, b) => b.totalValue - a.totalValue);

        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';
        leaderboard.forEach((item, i) => {
          const div = document.createElement('div');
          div.className = 'leaderboard-item';
          div.innerHTML = `
            <div class="rank">#${i + 1}</div>
            <div class="leader-name">${escapeHtml(item.username)}</div>
            <div class="leader-value">$${item.totalValue.toFixed(2)}</div>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        console.error("Leaderboard error:", err);
      }
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])
      );
    }

    function logout() {
      clearInterval(priceUpdateInterval);
      if (portfolioChart) {
          portfolioChart.destroy(); // Destroy chart on logout
          portfolioChart = null;
      }
      currentUser = null;
      document.getElementById('userInfo').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('status').textContent = '';
    }
    
    // Initial call to start the price process
    fetchAndCachePrices(); 
  </script>
</body>
</html>
