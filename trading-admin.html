<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Game Reset Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ed 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .reset-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #c0392b;
            margin-top: 0;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 25px;
            color: #555;
        }
        #resetBtn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        #resetBtn:hover:not(:disabled) {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        #resetBtn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        #statusMessage {
            margin-top: 20px;
            font-weight: 600;
            min-height: 20px;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="reset-container">
        <h1>⚠️ Trading Game Reset Tool</h1>
        <p>This will **permanently** reset all users' portfolios to their starting positions:</p>
        <ul>
            <li>**Stocks Owned:** 0 (Holdings reset to {})</li>
            <li>**Cash Balance:** $1,000,000.00</li>
        </ul>
        <button id="resetBtn" onclick="resetAllUsers()">
            RESET GAME FOR ALL USERS
        </button>
        <div id="statusMessage"></div>
    </div>

    <script>
        // ✅ YOUR LEAN CLOUD CREDENTIALS (Must match your "trading" app)
        const LEAN_CLOUD_APP_ID = "W9n8YEzowrs5Lzz3BqjttHiM-gzGzoHsz";
        const LEAN_CLOUD_APP_KEY = "5mrY6acHapGt8ngzVn0ZGBnw";
        const INITIAL_BALANCE = 1000000;
        
        // Initialize Lean Cloud
        AV.init({
            appId: LEAN_CLOUD_APP_ID,
            appKey: LEAN_CLOUD_APP_KEY,
            serverURL: "https://w9n8yezo.lc-cn-n1-shared.com"
        });

        const statusEl = document.getElementById('statusMessage');
        const resetBtn = document.getElementById('resetBtn');

        /**
         * Resets the holdings and balance for ALL users in the Student class.
         */
        async function resetAllUsers() {
            if (!confirm("ABSOLUTELY SURE? This action is IRREVERSIBLE and will reset ALL user data (stocks to 0, cash to $1M).")) {
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = "Processing Reset...";
            statusEl.className = '';
            statusEl.textContent = 'Fetching all users...';

            try {
                // 1. Fetch all Student objects
                const query = new AV.Query('Student');
                query.limit(1000); // Set a high limit to ensure all users are fetched
                const students = await query.find();

                if (students.length === 0) {
                    statusEl.className = 'success';
                    statusEl.textContent = 'No users found in the database. Reset complete (0 users affected).';
                    resetBtn.textContent = "RESET GAME FOR ALL USERS";
                    resetBtn.disabled = false;
                    return;
                }

                statusEl.textContent = `Found ${students.length} users. Preparing batch update...`;

                // 2. Prepare updates for each student
                const usersToSave = students.map(student => {
                    // Reset holdings to empty object (0 stocks)
                    student.set('holdings', {}); 
                    // Reset balance to $1,000,000
                    student.set('balance', INITIAL_BALANCE); 
                    return student;
                });

                // 3. Save all updates in a single batch operation
                await AV.Object.saveAll(usersToSave);

                statusEl.className = 'success';
                statusEl.textContent = `✅ Successfully reset ${students.length} users! Stocks set to 0, Cash set to $${INITIAL_BALANCE.toLocaleString()}.`;

            } catch (err) {
                statusEl.className = 'error';
                statusEl.textContent = `❌ Reset Failed: ${err.message}`;
                console.error("Game reset error:", err);

            } finally {
                // Re-enable the button after a delay, even if error occurred
                setTimeout(() => {
                    resetBtn.textContent = "RESET GAME FOR ALL USERS";
                    resetBtn.disabled = false;
                }, 3000);
            }
        }
    </script>
</body>
</html>
