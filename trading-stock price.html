<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks & Latest News Dashboard</title>

    <style>
        /* === CHART SECTION STYLES === */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .charts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1300px;
            margin: 0 auto;
        }

        .chart-item {
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
        }

        .chart-item h2 {
            margin-top: 0;
            color: #555;
            font-size: 1.2em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .chart-item iframe {
            display: block;
            width: 100%;
            height: 400px;
            border: none;
        }

        @media (min-width: 768px) {
            .chart-item {
                width: calc(50% - 10px);
            }
        }

        /* === NEWS SECTION STYLES === */
        #news-section-title {
            margin-top: 60px;
            text-align: center;
            font-size: 28px;
            color: #2a4d8f;
        }

        h2 {
            margin-top: 40px;
            color: #2a4d8f;
        }

        .news-item {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- ===== NEWS SECTION ===== -->
    <h1 id="news-section-title">Latest News for My Companies</h1>
    <div id="news"></div>

    <script>
        const companies = [
            "Apple Inc.", "Johnson & Johnson", "Exxon Mobil Corporation",
            "JPMorgan Chase & Co.", "Walmart Inc.", "The Boeing Company",
            "The Walt Disney Company", "Caterpillar Inc.",
            "Procter & Gamble Co.", "American Tower Corporation"
        ];

        const REUTERS_FEED =
            "https://api.allorigins.win/get?url=" +
            encodeURIComponent("http://feeds.reuters.com/reuters/businessNews");

        async function getNewsForCompany(company) {
            try {
                const r = await fetch(REUTERS_FEED);
                const data = await r.json();

                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");

                const items = [...xml.querySelectorAll("item")];
                const filtered = items.filter(i =>
                    i.querySelector("title").textContent.toLowerCase()
                        .includes(company.toLowerCase().split(" ")[0])
                );

                if (filtered.length > 0) {
                    return filtered.slice(0, 5).map(item => ({
                        title: item.querySelector("title").textContent,
                        link: item.querySelector("link").textContent
                    }));
                }
            } catch (e) {
                console.log("Reuters failed:", company, e);
            }

            // fallback: Google News RSS search
            const googleRSS =
                "https://api.allorigins.win/get?url=" +
                encodeURIComponent(
                    `https://news.google.com/rss/search?q=${encodeURIComponent(company)}&hl=en-US&gl=US&ceid=US:en`
                );

            const r2 = await fetch(googleRSS);
            const data2 = await r2.json();

            const parser2 = new DOMParser();
            const xml2 = parser2.parseFromString(data2.contents, "text/xml");

            const items2 = [...xml2.querySelectorAll("item")];

            return items2.slice(0, 5).map(item => ({
                title: item.querySelector("title").textContent,
                link: item.querySelector("link").textContent
            }));
        }

        async function generateNews() {
            const container = document.getElementById("news");

            for (const company of companies) {
                container.innerHTML += `<h2>${company}</h2>`;

                const newsItems = await getNewsForCompany(company);

                if (newsItems.length === 0) {
                    container.innerHTML += "<p>No news found.</p>";
                    continue;
                }

                newsItems.forEach(n => {
                    container.innerHTML += `
                    <div class="news-item">
                        <a href="${n.link}" target="_blank">${n.title}</a>
                    </div>`;
                });
            }
        }

        generateNews();
    </script>

</body>
