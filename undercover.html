<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 Undercover</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --secondary: #5bc0de;
            --warning: #f0ad4e;
            --danger: #d9534f;
            --bg-color: #eef2f5;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        /* --- Setup Form Styles --- */
        #setup-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin: 0 auto 30px auto;
            display: block; 
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: var(--primary-dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* --- Cards Display Styles --- */
        #cards-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 20px auto;
            padding: 10px;
        }

        .card-container {
            perspective: 1000px;
            aspect-ratio: 3/4;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.5s, transform 0.3s;
        }

        .card-container.active {
            opacity: 1;
            transform: scale(1.05);
        }
        
        @keyframes pulse {
            from { box-shadow: 0 0 10px var(--warning); }
            to { box-shadow: 0 0 25px var(--warning); }
        }

        .card-container.active .card {
            animation: pulse 1.5s infinite alternate;
            border: 2px solid var(--warning);
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
        }

        .card-front {
            background: linear-gradient(45deg, var(--secondary), #2980b9);
            color: white;
        }

        .card-front p {
            font-size: 1.1rem;
            margin: 10px 0;
            word-break: break-word;
        }

        .card-back {
            background-color: white;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #eee;
        }

        .card-back p {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 10px 0;
            text-transform: uppercase;
        }

        /* --- Game Controls --- */
        #game-controls {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 10px;
        }

        #final-reveal-button {
            background-color: var(--danger);
            display: none;
        }

        #restart-button {
            background-color: #607d8b; 
            display: none;
        }

        .identity-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            #cards-section {
                grid-template-columns: repeat(2, 1fr);
            }
            header h1 { font-size: 1.5rem; }
            #setup-section { padding: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>💸 Undercover</h1>
    </header>

    <div id="setup-section">
        <h2>Game Setup</h2>
        <div class="form-group">
            <label for="num-players">Number of Players:</label>
            <input type="number" id="num-players" min="3" value="4" onchange="generatePlayerInputs()" required>
        </div>

        <div id="player-inputs"></div>
        
        <div class="form-group">
            <label for="civilian-term">Civilian Term:</label>
            <input type="text" id="civilian-term" value="Asset" required>
        </div>
        
        <div class="form-group">
            <label for="undercover-term">Undercover Term:</label>
            <input type="text" id="undercover-term" value="Liability" required>
        </div>

        <button onclick="startGame()">Start Assignment</button>
        <p id="setup-error" style="color: var(--danger); text-align: center; font-weight: bold;"></p>
    </div>

    <div id="cards-section"></div>

    <div id="game-controls">
        <button id="final-reveal-button" onclick="finalReveal()">🏆 End Game & Reveal All</button>
        <button id="restart-button" onclick="restartGame()">🔄 New Game Setup</button>
    </div>

    <script>
        // ... (All your original JavaScript remains exactly the same) ...
        let players = [];
        let assignments = [];
        let currentCardIndex = 0;

        document.addEventListener('DOMContentLoaded', generatePlayerInputs);

        function generatePlayerInputs() {
            const numPlayers = parseInt(document.getElementById('num-players').value);
            const container = document.getElementById('player-inputs');
            container.innerHTML = '';
            
            if (isNaN(numPlayers) || numPlayers < 3) {
                document.getElementById('setup-error').textContent = 'Please enter at least 3 players.';
                return;
            } else {
                document.getElementById('setup-error').textContent = '';
            }

            for (let i = 0; i < numPlayers; i++) {
                const div = document.createElement('div');
                div.className = 'form-group';
                const playerName = players[i] || `Player ${i + 1}`;
                div.innerHTML = `
                    <label for="player-${i + 1}">Player ${i + 1} Name:</label>
                    <input type="text" id="player-${i + 1}" value="${playerName}" required>
                `;
                container.appendChild(div);
            }
        }

        function startGame() {
            const numPlayersInput = document.getElementById('num-players');
            const numPlayers = parseInt(numPlayersInput.value);
            const civilianTerm = document.getElementById('civilian-term').value.trim();
            const undercoverTerm = document.getElementById('undercover-term').value.trim();
            
            const tempPlayers = [];
            for (let i = 0; i < numPlayers; i++) {
                const nameInput = document.getElementById(`player-${i + 1}`);
                const name = nameInput ? nameInput.value.trim() : '';
                if (!name) {
                    document.getElementById('setup-error').textContent = `Please enter a name for Player ${i + 1}.`;
                    return;
                }
                tempPlayers.push(name);
            }
            players = tempPlayers;

            if (!civilianTerm || !undercoverTerm) {
                 document.getElementById('setup-error').textContent = 'Please enter both terms.';
                return;
            }

            let roles = Array(numPlayers).fill(civilianTerm);
            const undercoverIndex = Math.floor(Math.random() * numPlayers);
            roles[undercoverIndex] = undercoverTerm;

            const finalAssignments = players.map((name, index) => ({
                name: name,
                identity: roles[index],
                isUndercover: index === undercoverIndex
            }));

            shuffleArray(finalAssignments);
            assignments = finalAssignments; 
            currentCardIndex = 0;

            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('final-reveal-button').style.display = 'block';
            document.getElementById('restart-button').style.display = 'none';
            document.getElementById('setup-error').textContent = '';
            document.getElementById('cards-section').style.pointerEvents = 'auto';

            displayCards();
            activateCard(0);
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function displayCards() {
            const container = document.getElementById('cards-section');
            container.innerHTML = '';
            
            assignments.forEach((player, index) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.dataset.index = index;
                cardContainer.onclick = () => flipCard(index);

                cardContainer.innerHTML = `
                    <div class="card" id="card-${index}">
                        <div class="card-face card-front">
                            <span class="identity-label">Player</span>
                            <p>${player.name}</p>
                            <small style="opacity:0.7">Tap to reveal</small>
                        </div>
                        <div class="card-face card-back">
                            <span class="identity-label">Your Role</span>
                            <p style="color: ${player.isUndercover ? '#d9534f' : '#4CAF50'};">${player.identity}</p>
                            <small style="opacity:0.5">Tap to hide</small>
                        </div>
                    </div>
                `;
                container.appendChild(cardContainer);
            });
        }

        function activateCard(index) {
            const containers = document.querySelectorAll('.card-container');
            containers.forEach(c => c.classList.remove('active'));
            if (containers[index]) {
                containers[index].classList.add('active');
            }
        }
        
        function flipCard(index) {
            if (index !== currentCardIndex) return;
            const card = document.getElementById(`card-${index}`);
            const container = document.querySelector(`.card-container[data-index="${index}"]`);
            
            if (!card.classList.contains('is-flipped')) {
                card.classList.add('is-flipped');
                container.onclick = () => flipCardBack(index);
                container.classList.remove('active');
            } 
        }

        function flipCardBack(index) {
            const card = document.getElementById(`card-${index}`);
            const container = document.querySelector(`.card-container[data-index="${index}"]`);

            if (card.classList.contains('is-flipped')) {
                card.classList.remove('is-flipped');
                container.onclick = null;
                currentCardIndex++;
                if (currentCardIndex < assignments.length) {
                    activateCard(currentCardIndex);
                } else {
                    alert("All players have seen their identities. Let the discussion begin!");
                    document.getElementById('cards-section').style.pointerEvents = 'none';
                }
            }
        }
        
        function finalReveal() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.add('is-flipped'));
            document.getElementById('cards-section').style.pointerEvents = 'auto';
            document.getElementById('final-reveal-button').style.display = 'none';
            document.getElementById('restart-button').style.display = 'block';
            document.querySelectorAll('.card-container').forEach(c => c.classList.remove('active'));
        }
        
        function restartGame() {
            document.getElementById('cards-section').innerHTML = '';
            document.getElementById('final-reveal-button').style.display = 'none';
            document.getElementById('restart-button').style.display = 'none';
            document.getElementById('setup-section').style.display = 'block';
            document.getElementById('num-players').value = players.length;
            generatePlayerInputs(); 
        }
    </script>
</body>
</html>
